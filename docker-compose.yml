version: "3.9"

services:
  nodeloc-store:
    image: kaoqy666/nodeloc-store:latest
    container_name: nodeloc-store
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./db:/app/db
    environment:
      - TZ=Asia/Shanghai
      # 生产环境务必重写 JWT_SECRET
      - JWT_SECRET=${JWT_SECRET:-please-change-this-in-production}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # 资源限制（按需调整）
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"

