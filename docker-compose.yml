version: "3.9"

services:
  store:
    build: .
    restart: unless-stopped
    networks:
      - default
      - database
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads

networks:
  database:
    external: true
    name: ${DB_NETWORK:-1panel-network}
