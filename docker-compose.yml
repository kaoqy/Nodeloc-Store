version: "3.9"

services:
  store:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./instance:/app/instance
      - ./uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      # 默认值；首次启动后会被持久化到 db_data volume。
      # 想要自定义密码：先 docker compose down -v，再改下面三行重启。
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret_pass}
      MARIADB_DATABASE: ${DB_NAME:-nodeloc_store}
      MARIADB_USER: ${DB_USER:-store_user}
      MARIADB_PASSWORD: ${DB_PASSWORD:-store_pass}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
