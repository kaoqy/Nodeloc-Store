<!doctype html>
<html lang="zh-CN" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="/admin/favicon.svg" />
    <meta name="theme-color" content="#0a0b0d" />
    <title>Nodeloc Store 管理后台</title>
    <script>
      // Applied before first paint so the theme never flashes; the shop's own
      // accent rides along from the last value the settings API returned, so
      // the splash does not start out ember and then jump.
      var root = document.documentElement;
      root.dataset.theme =
        localStorage.getItem('store-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      var brand = localStorage.getItem('store-brand');
      if (brand && /^#[0-9a-f]{6}$/i.test(brand)) root.style.setProperty('--brand', brand);
      // The back office belongs to a named shop, and the tab should say so from
      // the first frame rather than after the status request lands.
      var shop = localStorage.getItem('store-name');
      if (shop) document.title = shop + ' 管理后台';
    </script>
    <style>
      /* Boot splash: the back office lazy-loads every view, so the first open
         would otherwise be a blank frame. Removed by main.ts once mounted. */
      #boot {
        position: fixed;
        inset: 0;
        z-index: 999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 18px;
        background: #0a0b0d;
        color: #f4f4f2;
        transition: opacity 260ms ease;
      }
      html[data-theme='light'] #boot {
        background: #f7f6f3;
        color: #17171a;
      }
      #boot-mark {
        display: grid;
        place-items: center;
        width: 46px;
        height: 46px;
        border: 1px solid currentColor;
        border-radius: 12px;
        font: 600 20px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
        animation: boot-pulse 1.4s ease-in-out infinite;
      }
      #boot-bar {
        position: relative;
        width: 132px;
        height: 2px;
        overflow: hidden;
        border-radius: 999px;
        background: color-mix(in srgb, currentColor 16%, transparent);
      }
      #boot-bar::after {
        content: '';
        position: absolute;
        inset: 0;
        width: 40%;
        border-radius: inherit;
        background: var(--brand, #f2704a);
        animation: boot-slide 1.1s ease-in-out infinite;
      }
      #boot p {
        margin: 0;
        font: 12px/1.6 system-ui, sans-serif;
        opacity: 0.55;
        letter-spacing: 0.04em;
      }
      .boot-hide {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes boot-pulse {
        50% { opacity: 0.45; transform: scale(0.97); }
      }
      @keyframes boot-slide {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot-mark,
        #boot-bar::after {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="boot">
      <span id="boot-mark" aria-hidden="true">N</span>
      <span id="boot-bar" aria-hidden="true"></span>
      <p>正在载入管理后台…</p>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
