{% extends "admin/base.html" %}
{% block title %}{{ '编辑' if product else '新建' }}商品 — 管理后台{% endblock %}
{% block header_title %}{{ '编辑' if product else '新建' }}商品{% endblock %}
{% block body %}
<div class="max-w-2xl">
  <div class="glass-card p-6">
    <form method="post" enctype="multipart/form-data" class="space-y-5">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">商品名称 *</label>
          <input type="text" name="name" value="{{ product.name if product else '' }}" class="w-full px-3 py-2 text-sm" required />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">Slug（URL别名）</label>
          <input type="text" name="slug" value="{{ product.slug if product else '' }}" class="w-full px-3 py-2 text-sm" placeholder="留空自动生成" />
        </div>
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">简介</label>
        <input type="text" name="summary" value="{{ product.summary if product else '' }}" class="w-full px-3 py-2 text-sm" placeholder="简短描述" />
      </div>

      <div>
        <label class="block text-xs text-slate-400 mb-1">详情（支持 HTML）</label>
        <textarea name="description" rows="5" class="w-full px-3 py-2 text-sm">{{ product.description if product else '' }}</textarea>
      </div>

      <div class="grid grid-cols-3 gap-4">
        <div>
          <label class="block text-xs text-slate-400 mb-1">价格（积分）*</label>
          <input type="number" name="price" value="{{ product.price if product else 0 }}" class="w-full px-3 py-2 text-sm" min="0" required />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">原价（划线）</label>
          <input type="number" name="original_price" value="{{ product.original_price or '' }}" class="w-full px-3 py-2 text-sm" min="0" />
        </div>
        <div>
          <label class="block text-xs text-slate-400 mb-1">商品图片</label>
          <input type="file" name="image" accept="image/*" class="text-xs text-slate-400" />
        </div>
      </div>

      {% if product and product.image_path %}
      <div class="flex items-center gap-3">
        <img src="{{ url_for('admin.uploaded_file', filename=product.image_path) }}" class="h-16 rounded-lg object-cover" />
        <span class="text-xs text-slate-500">{{ product.image_path }}</span>
      </div>
      {% endif %}

      <div class="flex gap-6">
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" name="is_published" {% if (product and product.is_published) or not product %}checked{% endif %} class="rounded border-slate-600" />
          上架
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" name="auto_deliver" {% if (product and product.auto_deliver) or not product %}checked{% endif %} class="rounded border-slate-600" />
          自动发货
        </label>
        <label class="flex items-center gap-2 text-sm">
          <input type="checkbox" name="stock_visible" {% if (product and product.stock_visible) or not product %}checked{% endif %} class="rounded border-slate-600" />
          显示库存
        </label>
      </div>

      <div class="flex gap-3 pt-2">
        <button type="submit" class="btn-primary px-5 py-2 rounded-lg text-sm">{{ '保存修改' if product else '创建商品' }}</button>
        <a href="{{ url_for('admin.products') }}" class="btn-outline px-5 py-2 rounded-lg text-sm">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
