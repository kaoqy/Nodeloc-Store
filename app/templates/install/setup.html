<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>安装 · NodeLoc Store</title>
  <link href="{{ url_for("static", filename="css/app.css") }}" rel="stylesheet" />
  <style>
    * { box-sizing: border-box; }
    body {
      background: radial-gradient(ellipse at 20% 50%, #0f172a 0%, #020617 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
      padding: 20px;
    }
    .glass {
      background: rgba(255,255,255,0.03);
      backdrop-filter: blur(32px) saturate(1.4);
      -webkit-backdrop-filter: blur(32px) saturate(1.4);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 32px;
      box-shadow: 0 40px 96px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
    }
    .glass-input {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 14px 18px;
      color: #f1f5f9;
      width: 100%;
      transition: all 0.25s ease;
      font-size: 14px;
      outline: none;
      font-weight: 400;
      letter-spacing: 0.01em;
    }
    .glass-input:focus {
      border-color: rgba(139, 92, 246, 0.5);
      background: rgba(255,255,255,0.06);
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.08);
    }
    .glass-input::placeholder { color: rgba(255,255,255,0.2); }
    .glass-input[readonly] {
      background: rgba(255,255,255,0.02);
      color: rgba(255,255,255,0.3);
      cursor: default;
    }
    .btn-primary {
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border: none;
      border-radius: 14px;
      padding: 14px 28px;
      font-weight: 600;
      font-size: 15px;
      color: white;
      width: 100%;
      cursor: pointer;
      transition: all 0.25s ease;
      letter-spacing: 0.3px;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.25);
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(124, 58, 237, 0.4);
    }
    .btn-copy {
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 14px;
      padding: 14px 18px;
      color: rgba(255,255,255,0.3);
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .btn-copy:hover {
      background: rgba(255,255,255,0.06);
      color: rgba(255,255,255,0.6);
    }
    .step-badge {
      display: inline-block;
      background: rgba(52, 211, 153, 0.08);
      color: #6ee7b7;
      font-size: 11px;
      font-weight: 600;
      padding: 6px 18px;
      border-radius: 999px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      border: 1px solid rgba(52, 211, 153, 0.08);
    }
    .text-muted { color: rgba(255,255,255,0.35); }
    .text-light { color: #f1f5f9; }
    .alert-error {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.12);
      border-radius: 14px;
      padding: 14px 18px;
      color: #fca5a5;
      font-size: 13px;
      margin-bottom: 24px;
    }
    .label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.35);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .label .req { color: #f87171; }
    .divider {
      border: none;
      border-top: 1px solid rgba(255,255,255,0.04);
      margin: 24px 0 22px;
    }
    .copy-field {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }
    .copy-field input { flex: 1; min-width: 0; }
    .copy-field .btn-copy { flex: 0 0 auto; }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: rgba(255,255,255,0.2);
      margin-bottom: 14px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
    a { color: #a78bfa; text-decoration: none; transition: color 0.2s; }
    a:hover { color: #c4b5fd; }
  </style>
</head>
<body class="installer-page">
<div class="w-full max-w-2xl px-4">
  <div class="glass installer-card p-8 md:p-10">
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">⚙️</div>
      <h1 class="text-3xl font-bold text-light tracking-tight">应用配置</h1>
      <p class="text-muted text-sm mt-2">第二步 · 配置 OAuth、支付和管理员</p>
      <div class="mt-4"><span class="step-badge">✅ 数据库已连接</span></div>
    </div>

    {% if error %}
    <div class="alert-error">{{ error }}</div>
    {% endif %}

    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="section-title">🏪 商店信息</div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="label">商店名称</label>
          <input type="text" name="site_name" class="glass-input" value="{{ defaults.site_name }}" placeholder="NodeLoc Store">
        </div>
        <div>
          <label class="label">商店标语</label>
          <input type="text" name="site_slogan" class="glass-input" value="{{ defaults.site_slogan }}" placeholder="卡密商店 · Powered by NodeLoc">
        </div>
      </div>

      <hr class="divider" />

      <div class="section-title">🔐 NodeLoc OAuth</div>
      <div class="text-muted text-xs mb-4 leading-relaxed opacity-60">
        在 <a href="https://www.nodeloc.com/oauth-provider/applications" target="_blank">NodeLoc</a> 创建 OAuth 应用，
        把下面的 <strong>回调地址</strong> 填到「回调地址」一栏。
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="label">OAuth URL</label>
          <input type="text" name="oauth_url" class="glass-input" value="{{ defaults.oauth_url }}" required>
        </div>
        <div>
          <label class="label">Client ID <span class="req">*</span></label>
          <input type="text" name="oauth_client_id" class="glass-input" value="{{ defaults.oauth_client_id }}" required>
        </div>
      </div>
      <div class="mt-4">
        <label class="label">Client Secret <span class="req">*</span></label>
        <input type="password" name="oauth_client_secret" class="glass-input" value="{{ defaults.oauth_client_secret }}" required>
      </div>
      <div class="mt-4">
        <label class="label">回调地址（自动生成）</label>
        <div class="copy-field">
          <input type="text" id="oauthRedirectUri" class="glass-input" readonly>
          <button type="button" class="btn-copy" data-copy="oauthRedirectUri">📋 复制</button>
        </div>
        <div class="text-muted text-xs mt-1 opacity-40">必须 HTTPS。如果显示 http，请通过反向代理提供 SSL 证书。</div>
      </div>

      <hr class="divider" />

      <div class="section-title">💳 NodeLoc 支付</div>
      <div class="text-muted text-xs mb-4 leading-relaxed opacity-60">
        在 <a href="https://www.nodeloc.com/payment/applications" target="_blank">NodeLoc</a> 创建支付应用，
        把下面的 <strong>回调地址</strong> 填到「通知 URL」一栏。
      </div>
      <div class="mt-4">
        <label class="label">回调地址（自动生成）</label>
        <div class="copy-field">
          <input type="text" id="paymentCallback" class="glass-input" readonly>
          <button type="button" class="btn-copy" data-copy="paymentCallback">📋 复制</button>
        </div>
      </div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mt-4">
        <div>
          <label class="label">Payment ID <span class="req">*</span></label>
          <input type="text" name="payment_id" class="glass-input" value="{{ defaults.payment_id }}" required>
        </div>
        <div>
          <label class="label">Secret Key <span class="req">*</span></label>
          <input type="password" name="payment_secret" class="glass-input" value="{{ defaults.payment_secret }}" required>
        </div>
      </div>

      <hr class="divider" />

      <div class="section-title">👤 管理员账号</div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="label">用户名 <span class="req">*</span></label>
          <input type="text" name="admin_user" class="glass-input" value="{{ defaults.admin_user }}" required>
        </div>
        <div>
          <label class="label">邮箱</label>
          <input type="email" name="admin_email" class="glass-input" value="{{ defaults.admin_email }}">
        </div>
      </div>
      <div class="mt-4">
        <label class="label">密码 <span class="req">*</span>（至少 8 位）</label>
        <input type="password" name="admin_pass" class="glass-input" value="{{ defaults.admin_pass }}" required minlength="8">
      </div>

      <hr class="divider" />

      <button type="submit" class="btn-primary">✔ 完成安装</button>
    </form>

    <div class="text-center text-muted text-xs mt-8 opacity-40 tracking-wider">
      NodeLoc Store · 安装向导
    </div>
  </div>
</div>

<script>
(function () {
  var origin = window.location.origin;
  var ri = document.getElementById('oauthRedirectUri');
  if (ri) ri.value = origin + '/auth/oauth/callback';
  var pc = document.getElementById('paymentCallback');
  if (pc) pc.value = origin + '/payment/callback';

  document.querySelectorAll('[data-copy]').forEach(function (btn) {
    btn.addEventListener('click', function () {
      var t = document.getElementById(btn.dataset.copy);
      if (!t) return;
      t.focus(); t.select(); t.setSelectionRange(0, 99999);
      try { document.execCommand('copy'); } catch (e) {}
      if (navigator.clipboard) navigator.clipboard.writeText(t.value).catch(function(){});
      var orig = btn.textContent;
      btn.textContent = '✓ 已复制';
      setTimeout(function () { btn.textContent = orig; }, 1400);
    });
  });
})();
</script>
</body>
</html>
