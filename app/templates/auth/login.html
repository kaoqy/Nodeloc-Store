{% extends "base.html" %}
{% block title %}登录 — {{ site_name }}{% endblock %}
{% block body %}
<div class="max-w-sm mx-auto mt-12">
  <div class="glass-card p-8">
    <h2 class="text-2xl font-bold text-white mb-6 text-center">登录</h2>

    <form method="post" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-xs text-slate-400 mb-1">用户名或邮箱</label>
        <input type="text" name="login" class="w-full px-3 py-2 text-sm" placeholder="请输入" required autofocus />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">密码</label>
        <input type="password" name="password" class="w-full px-3 py-2 text-sm" placeholder="••••••••" required />
      </div>
      <div class="flex items-center justify-between text-sm">
        <label class="flex items-center gap-2 text-slate-400">
          <input type="checkbox" name="remember" class="rounded border-slate-600 bg-slate-800" /> 记住我
        </label>
      </div>
      <button type="submit" class="btn-primary w-full py-2.5 rounded-lg font-semibold">登录</button>
    </form>

    <!-- OAuth divider -->
    <div class="flex items-center gap-3 my-5">
      <div class="flex-1 h-px bg-white/10"></div>
      <span class="text-xs text-slate-500">其他方式</span>
      <div class="flex-1 h-px bg-white/10"></div>
    </div>

    <a href="{{ url_for('auth.oauth_initiate') }}"
       class="flex items-center justify-center gap-2 w-full py-2.5 rounded-lg border border-indigo-500/40 text-indigo-300 hover:bg-indigo-500/10 transition font-medium text-sm">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9V8h2v8zm4 0h-2V8h2v8z"/></svg>
      使用 NodeLoc 登录
    </a>

    <p class="text-center text-sm text-slate-400 mt-5">
      还没有账号？<a href="{{ url_for('auth.register') }}" class="text-indigo-400 hover:underline">立即注册</a>
    </p>
  </div>
</div>
{% endblock %}
