{% extends "base.html" %}
{% block title %}注册 — {{ site_name }}{% endblock %}
{% block body %}
<div class="container-sm" style="padding-top:48px;">
  <div class="card">
    <h1 class="text-center mb-5">注册账号</h1>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">用户名 <span class="req">*</span></label>
        <input type="text" name="username" required autofocus />
      </div>
      <div class="form-group">
        <label class="form-label">邮箱（可选）</label>
        <input type="email" name="email" />
      </div>
      <div class="form-group">
        <label class="form-label">密码 <span class="req">*</span>（至少 8 位）</label>
        <input type="password" name="password" required minlength="8" />
      </div>
      <div class="form-group">
        <label class="form-label">确认密码 <span class="req">*</span></label>
        <input type="password" name="password2" required minlength="8" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">注册</button>
    </form>
    <p class="text-center text-sm text-dim mt-4">
      已有账号？<a href="{{ url_for('auth.login') }}">登录</a>
    </p>
  </div>
</div>
{% endblock %}
