{% extends "base.html" %}
{% block title %}注册 — {{ site_name }}{% endblock %}
{% block body %}
<div class="max-w-sm mx-auto mt-12">
  <div class="glass-card p-8">
    <h2 class="text-2xl font-bold text-white mb-6 text-center">注册账号</h2>
    <form method="post" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-xs text-slate-400 mb-1">用户名 *</label>
        <input type="text" name="username" class="w-full px-3 py-2 text-sm" placeholder="用于登录" required autofocus />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">邮箱（可选）</label>
        <input type="email" name="email" class="w-full px-3 py-2 text-sm" placeholder="用于找回密码" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">密码 *（至少 8 位）</label>
        <input type="password" name="password" class="w-full px-3 py-2 text-sm" placeholder="••••••••" required />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">确认密码 *</label>
        <input type="password" name="password2" class="w-full px-3 py-2 text-sm" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-primary w-full py-2.5 rounded-lg font-semibold">注册</button>
    </form>
    <p class="text-center text-sm text-slate-400 mt-5">
      已有账号？<a href="{{ url_for('auth.login') }}" class="text-indigo-400 hover:underline">登录</a>
    </p>
  </div>
</div>
{% endblock %}
