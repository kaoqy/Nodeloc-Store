{% extends "base.html" %}
{% block body %}
<div class="container-sm text-center" style="padding-top:80px;">
  <div class="card">
    <div style="font-size:48px; opacity:.4; margin-bottom:12px;">{{ {'404':'🔍','403':'🔒','500':'⚠️'}[code|default('404')] }}</div>
    <h1 class="mb-2">{{ code|default('404') }}</h1>
    <p class="text-dim mb-4">{{ message|default('页面出错了') }}</p>
    <a href="{{ url_for('store.index') }}" class="btn btn-primary btn-sm">返回首页</a>
  </div>
</div>
{% endblock %}
