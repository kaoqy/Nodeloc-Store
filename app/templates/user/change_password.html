{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block body %}
<div class="max-w-sm mx-auto mt-10">
  <div class="glass-card p-6">
    <h2 class="text-lg font-bold text-white mb-5">修改密码</h2>
    <form method="post" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-xs text-slate-400 mb-1">当前密码</label>
        <input type="password" name="old_password" class="w-full px-3 py-2 text-sm" required />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">新密码（至少 8 位）</label>
        <input type="password" name="new_password" class="w-full px-3 py-2 text-sm" required minlength="8" />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">确认新密码</label>
        <input type="password" name="new_password2" class="w-full px-3 py-2 text-sm" required />
      </div>
      <button type="submit" class="btn-primary w-full py-2.5 rounded-lg">修改密码</button>
    </form>
  </div>
</div>
{% endblock %}
