{% extends "base.html" %}
{% block title %}修改密码{% endblock %}
{% block body %}
<div class="container-sm" style="padding-top:24px;">
  <div class="card">
    <h2 class="mb-4">修改密码</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">当前密码</label>
        <input type="password" name="old_password" required />
      </div>
      <div class="form-group">
        <label class="form-label">新密码（至少 8 位）</label>
        <input type="password" name="new_password" required minlength="8" />
      </div>
      <div class="form-group">
        <label class="form-label">确认新密码</label>
        <input type="password" name="new_password2" required minlength="8" />
      </div>
      <button type="submit" class="btn btn-primary">修改</button>
      <a href="{{ url_for('user.profile') }}" class="btn btn-ghost">取消</a>
    </form>
  </div>
</div>
{% endblock %}
