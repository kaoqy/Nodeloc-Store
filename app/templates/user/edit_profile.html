{% extends "base.html" %}
{% block title %}编辑资料{% endblock %}
{% block body %}
<div class="container-sm" style="padding-top:24px;">
  <div class="card">
    <h2 class="mb-4">编辑资料</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" name="username" value="{{ current_user.username }}" required />
      </div>
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input type="email" name="email" value="{{ current_user.email or '' }}" />
      </div>
      <button type="submit" class="btn btn-primary">保存</button>
      <a href="{{ url_for('user.profile') }}" class="btn btn-ghost">取消</a>
    </form>
  </div>
</div>
{% endblock %}
