{% extends "base.html" %}
{% block title %}编辑资料{% endblock %}
{% block body %}
<div class="container-sm" style="padding-top:40px;">
  <div class="card fade-in" style="max-width:500px; margin:0 auto;">
    <h2 class="mb-5">编辑资料</h2>
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" name="username" value="{{ current_user.username }}" required />
      </div>
      <div class="form-group">
        <label class="form-label">邮箱</label>
        <input type="email" name="email" value="{{ current_user.email or '' }}" />
      </div>
      <div class="flex gap-2">
        <button type="submit" class="btn btn-primary">保存</button>
        <a href="{{ url_for('user.profile') }}" class="btn btn-ghost">取消</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
