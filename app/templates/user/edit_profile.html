{% extends "base.html" %}
{% block title %}编辑资料{% endblock %}
{% block body %}
<div class="max-w-sm mx-auto mt-10">
  <div class="glass-card p-6">
    <h2 class="text-lg font-bold text-white mb-5">编辑资料</h2>
    <form method="post" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <div>
        <label class="block text-xs text-slate-400 mb-1">用户名</label>
        <input type="text" name="username" value="{{ current_user.username }}" class="w-full px-3 py-2 text-sm" required />
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">邮箱</label>
        <input type="email" name="email" value="{{ current_user.email or '' }}" class="w-full px-3 py-2 text-sm" placeholder="选填" />
      </div>
      <button type="submit" class="btn-primary w-full py-2.5 rounded-lg">保存</button>
    </form>
  </div>
</div>
{% endblock %}
